function storage(store,method,value,key){if(store==='kv'&&method==='put'&&key==='config')value={...value,_baseTag:CONFIG_TAG};return new Promise((resolve,reject)=>{const tx=db.transaction(store,method==='get'||method==='getAll'?'readonly':'readwrite');const os=tx.objectStore(store);const req=key!==undefined?os[method](value,key):value!==undefined?os[method](value):os[method]();let result;req.onsuccess=()=>result=req.result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Không lưu được dữ liệu'))})}

function bindFields(){$$('[data-field]').forEach(input=>{const update=()=>{setPath(input.dataset.field,input.value);input.classList.remove('invalid');const e=input.closest('.field').querySelector('.error-text');if(e)e.textContent=''};input.oninput=update;input.onchange=update});$$('[data-quick]').forEach(b=>b.onclick=()=>{setPath(b.dataset.quick,b.dataset.value);const input=$(`[data-field="${b.dataset.quick}"]`);input.value=b.dataset.value;input.classList.remove('invalid');input.closest('.field').querySelector('.error-text').textContent=''})}
function switchVariant(kind,value){if(state.report[kind]===value)return;const apply=()=>{state.report[kind]=value;state.report.special={};if(kind==='type')state.report.photos={};state.report.saveKey=uid();scheduleDraft();renderForm()};if(state.editing){toast('Báo cáo đã gửi giữ nguyên phòng/ban và chương trình. Tạo báo cáo mới để đổi.',true);return}if(Object.values(state.report.special).some(Boolean)||kind==='type'&&Object.values(state.report.photos).some(v=>v.items?.length||v.absent)){dialog('Đổi biểu mẫu',`<p>Đổi ${kind==='role'?'phòng/ban':'chương trình'} sẽ xóa phần chuyên môn${kind==='type'?' và ảnh':''} của bản nháp hiện tại. Thông tin chung vẫn được giữ.</p><button class="btn" id="confirm-variant" style="margin-top:18px">Đổi biểu mẫu</button>`);$('#confirm-variant').onclick=()=>{closeModal();apply()}}else apply()}
function missing(step,r=state.report){const result=[];if(step===0){commonFields().forEach(f=>{if(!String(r.common[f.id]||'').trim())result.push({key:'common.'+f.id,label:fieldDef(f).label})});if(!/^\d{4}-\d{2}-\d{2}$/.test(r.common.date||''))result.push({key:'common.date',label:'Ngày khảo sát'})}if(step===1){[...SCHEMAS[r.role][r.type].map(f=>[f,'special']),...CONCLUSION.map(f=>[f,'conclusion'])].forEach(([f,g])=>{if(!String(r[g][f.id]||'').trim())result.push({key:g+'.'+f.id,label:fieldDef(f).label})})}if(step===2){photoDefs(r.type).forEach(([key,label])=>{const slot=r.photos[key];if(!slot||(!slot.items.length&&!slot.absent)||(slot.absent&&!String(slot.reason||'').trim()))result.push({key:'photos.'+key,label})})}return result}
function showErrors(errors){let first;errors.forEach(({key,label})=>{if(key.startsWith('photos.')){const el=$(`[data-media="${key.split('.')[1]}"]`);if(el){el.classList.add('invalid');el.querySelector('.error-text').textContent='Thêm ảnh hoặc chọn không có ảnh và ghi lý do.';first=first||el}}else{const el=$(`[data-field="${key}"]`);if(el){el.classList.add('invalid');el.closest('.field').querySelector('.error-text').textContent='Vui lòng điền mục này.';first=first||el}}});if(first){first.scrollIntoView({behavior:'smooth',block:'center'});first.focus?.()}toast('Còn '+errors.length+' mục bắt buộc chưa hoàn tất.',true)}

function reviewHTML(r){const group=(title,arr,data)=>`<section class="review-section"><h3>${esc(title)}</h3>${arr.map(f=>`<div class="review-row"><span>${esc(fieldDef(f).label)}</span><strong>${esc(data[f.id]||'Chưa điền')}</strong></div>`).join('')}</section>`;return `<div class="pill green">${ROLE[r.role]} · ${TYPE[r.type]}</div>${group('Thông tin chung',COMMON,r.common)}${group('Chuyên môn '+ROLE[r.role],SCHEMAS[r.role][r.type],r.special)}${group('Kết luận & hành động',CONCLUSION,r.conclusion)}<section class="review-section"><h3>Ảnh bằng chứng</h3>${photoDefs(r.type).map(([k,label])=>{const slot=r.photos[k]||{items:[]};return `<div class="review-row"><span>${esc(label)}</span><strong>${slot.items.length?slot.items.length+' ảnh':slot.absent?'Không có ảnh · '+esc(slot.reason):'Chưa có'}</strong></div>`}).join('')}</section><p class="hint" style="margin-top:15px">Mã đối tượng: ${esc(r.objectId)}<br>Mã báo cáo: ${esc(r.id)}</p>`}
async function resizeImage(file,max=1600,quality=.8){
  if(!file.type.startsWith('image/')||file.type==='image/svg+xml')throw Error('Chọn ảnh JPG, PNG hoặc WEBP. Ảnh HEIC cần đổi sang JPG nếu trình duyệt không đọc được.');
  if(file.size>20*1024*1024)throw Error('Ảnh gốc quá 20 MB. Hãy chọn ảnh nhỏ hơn.');
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(Error('Không đọc được ảnh. Hãy dùng JPG/PNG/WEBP.'));i.src=url});
    const ratio=Math.min(1,max/Math.max(img.width,img.height)),can=document.createElement('canvas');
    can.width=Math.max(1,Math.round(img.width*ratio));can.height=Math.max(1,Math.round(img.height*ratio));
    const ctx=can.getContext('2d'),keepAlpha=max===500;
    if(!keepAlpha){ctx.fillStyle='#fff';ctx.fillRect(0,0,can.width,can.height)}
    ctx.drawImage(img,0,0,can.width,can.height);
    let data=can.toDataURL(keepAlpha?'image/png':'image/jpeg',quality);
    if(!keepAlpha&&data.length>1500000)data=can.toDataURL('image/jpeg',.6);
    if(data.length>1900000)throw Error('Ảnh quá lớn sau tối ưu. Chọn ảnh ít chi tiết hơn.');
    return data;
  }finally{URL.revokeObjectURL(url)}
}
async function handleUpload(input){const key=input.dataset.upload,files=[...input.files];if(!files.length)return;const r=state.report,slot=r.photos[key]||(r.photos[key]={items:[],absent:false,reason:''});if(slot.items.length+files.length>2){toast('Mỗi nhóm tối đa 2 ảnh. Chọn lại số ảnh phù hợp.',true);input.value='';return}pendingPhoto++;input.disabled=true;toast('Đang tối ưu ảnh…');try{for(const f of files){const data=await resizeImage(f);slot.items.push({clientId:uid(),name:f.name,mimeType:'image/jpeg',data})}slot.absent=false;slot.reason='';r.saveKey=uid();await saveDraft();renderForm();toast('Đã thêm ảnh và lưu nháp trên thiết bị.')}catch(e){await saveDraft();renderForm();toast(e.message,true)}finally{pendingPhoto--;input.disabled=false}}

function validGoogleOrigin(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('.script.googleusercontent.com')||/^[a-z0-9-]+-script\.googleusercontent\.com$/.test(u.hostname))}catch{return false}}
function initBridge(){bridgePeer=null;bridgeNonce=uid();remoteRequests.forEach(req=>{clearTimeout(req.timer);req.reject(Error('Kết nối đã đổi. Vui lòng thử lại.'))});remoteRequests.clear();bridgeReady=new Promise((res,rej)=>{bridgeResolve=res;bridgeReject=rej});bridgeReady.catch(()=>{});const url=new URL(cfg.apiUrl);url.searchParams.set('origin',location.origin);url.searchParams.set('nonce',bridgeNonce);$('#bridge').innerHTML=`<iframe title="Kết nối dữ liệu" class="remote-frame" src="${esc(url.href)}"></iframe>`;const expectedNonce=bridgeNonce;setTimeout(()=>{if(!bridgePeer&&expectedNonce===bridgeNonce)bridgeReject(Error('Không kết nối được Apps Script. Kiểm tra URL /exec, quyền truy cập và origin trong Code.gs.'))},20000)}
window.addEventListener('message',e=>{const d=e.data;if(!d||d.channel!=='thttex-aw28'||d.nonce!==bridgeNonce||!validGoogleOrigin(e.origin))return;if(d.kind==='ready'){if(!bridgePeer){bridgePeer=e.source;bridgeResolve(true)}return}if(e.source!==bridgePeer)return;const req=remoteRequests.get(d.requestId);if(req){clearTimeout(req.timer);remoteRequests.delete(d.requestId);d.ok?req.resolve(d.result):req.reject(Error(d.error||'Kết nối trả lỗi'))}});
async function remoteCall(action,payload){if(!cfg.apiUrl)throw Error('Chưa cấu hình kết nối');if(!bridgeReady)initBridge();try{await bridgeReady}catch(e){bridgeReady=null;throw e}const requestId=uid();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{remoteRequests.delete(requestId);reject(Error('Chưa nhận được xác nhận. Nháp vẫn được giữ; thử gửi lại cùng bản ghi để tránh trùng.'))},120000);remoteRequests.set(requestId,{resolve,reject,timer});bridgePeer.postMessage({channel:'thttex-aw28',nonce:bridgeNonce,requestId,action,payload},'*')})}
function checkURL(v){if(!v)return true;try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/.+\/exec$/.test(u.pathname)}catch{return false}}

function sanitizeConfig(c){const out=structuredClone(EMBEDDED);for(const key of ['brand','title','subtitle','eyebrow','footer','guideTitle','guideText','emptyTitle','emptyText','submitText','requiredHint'])if(typeof c[key]==='string')out[key]=c[key].slice(0,1000);for(const k of ['blue','green'])if(/^#[0-9a-f]{6}$/i.test(c[k]||''))out[k]=c[k];for(const k of ['logo','heroImage','guideImage'])if(typeof c[k]==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(c[k])&&c[k].length<2000000)out[k]=c[k];out.apiUrl=checkURL(c.apiUrl||'')?c.apiUrl||'':'';out.roster=Array.isArray(c.roster)?c.roster.filter(n=>typeof n==='string').slice(0,200).map(n=>n.slice(0,100)):[];for(const k of ['fieldText','photoText']){out[k]={};if(c[k]&&typeof c[k]==='object')Object.entries(c[k]).slice(0,100).forEach(([id,v])=>{if(v&&typeof v==='object'){const next={};for(const prop of ['label','hint','placeholder'])if(typeof v[prop]==='string')next[prop]=v[prop].slice(0,1000);out[k][id]=next}})}return out}

function canSee(r){return !!session&&(session.admin||r.role===session.role)}
function loginScreen(){document.documentElement.style.setProperty('--blue',cfg.blue);document.documentElement.style.setProperty('--green',cfg.green);$('#app').innerHTML=`<main class="auth-shell"><div class="brand">${cfg.logo?`<img src="${esc(cfg.logo)}" alt="Logo">`:esc(cfg.brand)}</div><section class="hero"><div><h1>${esc(cfg.loginTitle)}</h1><p>${esc(cfg.loginIntro)}</p></div></section><section class="card card-pad"><div class="field"><label>Tên đăng nhập</label><input id="login-user" value="THTTEX" autocomplete="username"></div><div class="field"><label>Mật khẩu</label><input id="login-pass" type="password" autocomplete="current-password"></div><div class="field"><label>Phòng/ban</label><select id="login-role">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select></div><div class="auth-error" id="login-error"></div><button class="btn green" id="login-button">Đăng nhập</button><p class="login-help">Bản xem trước: nhân viên 1234, admin 8888. Kết nối thật kiểm tra mật khẩu tại máy chủ.</p></section></main>`;$('#login-button').onclick=async()=>{const user=$('#login-user').value,pass=$('#login-pass').value,role=$('#login-role').value;try{let auth;if(cfg.apiUrl)auth=await baseRemote('login',{user,password:pass,role});else{if(user!=='THTTEX'||!['1234','8888'].includes(pass))throw Error('Tên đăng nhập hoặc mật khẩu không đúng.');auth={admin:pass==='8888',role,token:''}}session=auth;state.report=newReport();state.report.role=role;const draft=await storage('kv','get','draft-'+role);if(draft){state.report=draft.report;state.step=draft.step;state.editing=draft.editing}state.items=[];render()}catch(e){$('#login-error').textContent=e.message}};$('#login-pass').onkeydown=e=>{if(e.key==='Enter')$('#login-button').click()};}
newReport=(function(old){return function(){const r=old();if(session)r.role=session.role;return r}})(newReport);
saveDraft=async function(){if(!session||demoMode||state.report?.isDemo)return;await storage('kv','put',{report:state.report,step:state.step,editing:state.editing},'draft-'+session.role);const el=$('#save-state');if(el)el.textContent='Đã lưu nháp trên thiết bị'};
remoteCall=async function(action,payload){if(action!=='login'&&action!=='ping'&&!session?.token)throw Error('Vui lòng đăng nhập lại.');return baseRemote(action,{...payload,token:session?.token})};
render=function(){if(!session){loginScreen();return}applySchema();if(state.tab==='dashboard'&&!session.admin)state.tab='reports';baseRender();if(!session.admin){$('#edit-ui').remove();$('[data-tab="dashboard"]')?.remove()}const bar=document.createElement('div');bar.className='session-bar';bar.innerHTML=`<span>${session.admin?'Admin':esc(ROLE[session.role])} · ${demoMode?'DEMO':cfg.apiUrl?'Google Sheets / Drive':'Thử trên thiết bị'}</span><div class="actions-inline"><button class="btn secondary small" id="demo-toggle">${demoMode?'Thoát demo':'Xem demo'}</button><button class="btn secondary small" id="logout">Đăng xuất</button></div>`;$('.nav').before(bar);$('#logout').onclick=async()=>{await saveDraft();session=null;state.items=[];state.tab='form';demoMode=false;bridgeReady=null;$('#bridge').innerHTML='';loginScreen()};$('#demo-toggle').onclick=async()=>{if(state.editing){toast('Kết thúc chỉnh sửa trước khi đổi chế độ.',true);return}await saveDraft();demoMode=!demoMode;if(!demoMode){const d=await storage('kv','get','draft-'+session.role);state.report=d?.report||newReport();state.step=d?.step||0;state.editing=!!d?.editing}state.tab='reports';state.items=[];render();await refreshReports()};if(demoMode){const n=document.createElement('div');n.className='notice amber mode-banner';n.textContent=cfg.demoNotice;$('#main').before(n)}if(copyMode)attachCopyEditor();applyCopy();};
renderForm=function(){baseForm();if(!session.admin)$$('[data-role]').forEach(b=>{b.disabled=true;b.classList.add('locked-role')});const summary=$('#link-object')?.closest('details');if(summary){summary.querySelector('summary').textContent=cfg.linkTitle;summary.querySelector('.hint').textContent=cfg.linkIntro;const demo=document.createElement('p');demo.className='hint';demo.textContent='Ví dụ: RD ghi chất liệu áo shell xanh navy. Marketing chọn cùng sản phẩm để ghi màu/kiểu dáng; Sales chọn cùng sản phẩm để ghi cơ hội bán. Ba báo cáo riêng, một mã sản phẩm chung.';summary.append(demo)}applyCopy()};
filtered=function(){return baseFiltered().filter(canSee)};
refreshReports=async function(){try{state.items=demoMode?structuredClone(cfg.demoRecords):cfg.apiUrl?await remoteCall('list',{}):await storage('reports','getAll');state.items=state.items.filter(canSee);state.items.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));renderMain();if(!session.admin&&$('#role-filter')){$('#role-filter').value=session.role;$('#role-filter').disabled=true}applyCopy()}catch(e){toast(e.message,true)}};
getReport=async function(id){const r=demoMode?cfg.demoRecords.find(x=>x.id===id):await baseGet(id);if(!r||!canSee(r))throw Error('Bạn không có quyền xem báo cáo này.');return structuredClone(r)};
renderDashboard=function(){if(!session?.admin){$('#main').textContent='Mục tổng hợp dành cho admin.';return}baseDashboard();applyCopy()};
submit=async function(){if(demoMode||state.report.isDemo){toast('Báo cáo demo chỉ để xem và chỉnh thử, không gửi vào dữ liệu thật.',true);return}if(!canSee(state.report)){toast('Phòng ban không khớp phiên đăng nhập.',true);return}const before=state.report.id;await baseSubmit();if(state.report.id!==before)await storage('kv','delete','draft-'+session.role)};
showObjects=async function(){if(state.editing){toast('Tạo báo cáo mới để chọn sản phẩm khác.',true);return}try{const items=demoMode?cfg.demoRecords:cfg.apiUrl?await remoteCall('objects',{}):await storage('reports','getAll');const seen=new Set();const objects=items.filter(r=>r.type===state.report.type&&!seen.has(r.objectId)&&seen.add(r.objectId));dialog(cfg.linkTitle,`<p>${esc(cfg.linkIntro)}</p><p class="hint">Danh mục chung chỉ gồm mô tả, brand, địa điểm và mã sản phẩm; không hiển thị nội dung chuyên môn của phòng ban khác.</p>${objects.map((r,i)=>`<button class="shared-object" data-pick="${i}"><strong>${esc(r.common.product)}</strong><p>${esc(r.common.brand)} · ${esc(r.common.site)}</p><small>${esc(r.objectId)}</small></button>`).join('')||'<p>Chưa có sản phẩm. Tạo ghi nhận mới để hệ thống cấp mã.</p>'}`,true);$$('[data-pick]').forEach(b=>b.onclick=()=>{const r=objects[+b.dataset.pick];state.report.objectId=r.objectId;['brand','site','area','product','category','application','observedSeason','stockStatus'].forEach(k=>state.report.common[k]=r.common[k]||'');state.report.saveKey=uid();scheduleDraft();closeModal();renderForm()})}catch(e){toast(e.message,true)}};
showConnection=function(){if(!session?.admin){toast('Admin cấu hình kết nối.',true);return}dialog('Kết nối dữ liệu',`<div class="connection-card"><p>Google Sheet: <a href="${esc(cfg.sheetUrl||'')}" target="_blank" rel="noopener">Bảng tổng hợp AW28</a></p><p>Ảnh: <a href="${esc(cfg.driveFolderUrl)}" target="_blank" rel="noopener">Thư mục ảnh AW28</a></p></div><p>Sheet và thư mục đã cấu hình. Cần triển khai Code.gs trong Apps Script rồi nhập URL /exec để bật gửi dữ liệu thật.</p><div class="field"><label>URL Apps Script /exec</label><input id="api-input" value="${esc(cfg.apiUrl)}"></div><button class="btn" id="save-api">Lưu URL</button>`,true);$('#save-api').onclick=async()=>{const u=$('#api-input').value.trim();if(!checkURL(u)||!u){toast('URL chưa đúng.',true);return}cfg.apiUrl=u;await storage('kv','put',cfg,'config');bridgeReady=null;closeModal();session=null;loginScreen();toast('Đăng nhập lại để kiểm tra kết nối thật.')}};
function applyCopy(){if(!cfg.uiText)return;const root=$('#app');const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walk.nextNode()){if(node.parentElement.closest('script,style,textarea,input,[contenteditable]'))continue;const key=node.textContent;if(Object.hasOwn(cfg.uiText,key))node.textContent=cfg.uiText[key]}}
function attachCopyEditor(){const toolbar=document.createElement('div');toolbar.className='copy-toolbar';toolbar.innerHTML='<span>Chạm vào chữ để sửa. Không sửa nội dung báo cáo trong chế độ này.</span><button class="btn small" id="copy-done">Lưu chữ</button>';$('.topbar').after(toolbar);const selectors='h1,h2,h3,label,summary,.sub,.hint,.notice,.eyebrow,.footer,.btn,.aside-card p';$$(selectors,$('#app')).filter(el=>!el.closest('.records,.review-section,.session-bar,.copy-toolbar')&&!el.querySelector('input,textarea,select,button')).forEach(el=>{const original=el.textContent;if(!original.trim())return;el.contentEditable='true';el.classList.add('editable-copy');el.oninput=()=>{cfg.uiText[original]=el.textContent}});$('#copy-done').onclick=async()=>{copyMode=false;await storage('kv','put',cfg,'config');render()};}
showEditor=function(){if(!session?.admin)return;baseEditor();const body=$('.dialog-body');const box=document.createElement('section');box.className='editor-section';box.innerHTML=`<h3>Chỉnh toàn bộ chữ và biểu mẫu</h3><p>Chỉnh chữ trực tiếp trên màn hình, hoặc chỉnh JSON bên dưới để đổi toàn bộ nhãn, gợi ý, danh sách lựa chọn và demo. Giữ mã trường để kết nối Sheet.</p><button class="btn secondary" id="edit-copy">Sửa chữ trên màn hình</button><div class="field"><label>Toàn bộ cấu hình app</label><textarea id="full-config" rows="12" style="min-height:260px">${esc(JSON.stringify(cfg,null,2))}</textarea></div><button class="btn green" id="apply-full">Lưu cấu hình đầy đủ</button>`;body.prepend(box);$('#edit-copy').onclick=()=>{closeModal();copyMode=true;render()};$('#apply-full').onclick=async()=>{try{const c=JSON.parse($('#full-config').value);for(const k of ['common','conclusion']){if(JSON.stringify(c.schema[k].map(f=>f.id))!==JSON.stringify(cfg.schema[k].map(f=>f.id)))throw Error('Giữ mã và số câu hỏi để khớp backend.')}for(const role of Object.keys(SCHEMAS))for(const type of Object.keys(TYPE)){if(JSON.stringify(c.schema.roles[role][type].map(f=>f.id))!==JSON.stringify(cfg.schema.roles[role][type].map(f=>f.id)))throw Error('Giữ mã câu hỏi chuyên môn.')}cfg=sanitizeConfig(c);await storage('kv','put',cfg,'config');applySchema();closeModal();render();toast('Đã lưu. Tải HTML từ Chỉnh giao diện để xuất bản.')}catch(e){toast(e.message,true)}};};
async function bootV2(){try{db=await openDB();const stored=await storage('kv','get','config');if(stored&&stored._baseTag===CONFIG_TAG)cfg=sanitizeConfig(stored);applySchema();state.report=newReport();loginScreen()}catch(e){toast(e.message,true)}}
ORIGINAL_HTML='<!doctype html>\n'+document.documentElement.outerHTML;
bootV2();

</script></body></html>
